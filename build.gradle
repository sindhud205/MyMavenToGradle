plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0-SNAPSHOT'
description = 'MyMavenToGradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:3.8.1'
}

application {
    mainClass = 'com.example.App'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.example.App'
        )
    }
}
